# Local development database. Production uses Azure Database for PostgreSQL (Flexible Server).
services:
  db:
    image: postgres:17-alpine
    container_name: pwc-utilization-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_dev_only
      POSTGRES_DB: utilization
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d utilization"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
